{% extends "base.html" %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post">
  <label>Account number</label>
  <input type="text" name="accno" required>
  <label>Amount</label>
  <input type="number" name="amount" step="0.01" min="0.01" required>
  <button type="submit">{{ title }}</button>
</form>
{% endblock %}
